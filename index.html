<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>連結收藏</title>
<style>
:root{--tx:#37352f;--mu:#9b9a97;--bd:#e9e9e7;--hv:#f7f7f5}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--tx);font:15px/1.55 -apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding-bottom:110px}
.w{max-width:640px;margin:auto;padding:0 16px}
h1{font-size:28px;margin:28px 0 12px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;border:1px solid var(--bd);border-radius:6px;padding:9px 10px;background:#fff}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid #2383e2;outline-offset:-1px}
#fs{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--bd);background:#fff;border-radius:6px;padding:5px 11px;cursor:pointer}
.chip.on{background:var(--tx);color:#fff;border-color:var(--tx)}
.chip.add{color:var(--mu);border-style:dashed}
#bar{display:flex;gap:16px;padding:4px 0}
#bar button,footer button{border:0;background:0;color:var(--mu);font-size:13px;padding:6px 0}
.it{display:block;padding:12px 4px;border-bottom:1px solid var(--bd);cursor:pointer}
.it:active{background:var(--hv)}
.tt{font-weight:600;overflow-wrap:anywhere}
.mt{color:var(--mu);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt{font-size:14px;color:#605e59;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.em{color:var(--mu);text-align:center;padding:48px 16px}
footer{display:flex;gap:18px;margin-top:24px}
#fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;border:0;background:var(--tx);color:#fff;font-size:28px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.bk{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:5}
.sh{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:grid;gap:10px;max-width:640px;margin:auto}
.sh h2{margin:0;font-size:17px}
.row{display:flex;gap:10px}.row button{flex:1}
.g,.p{border-radius:6px;padding:10px;border:1px solid var(--bd);background:#fff}
.p{background:var(--tx);color:#fff;border-color:var(--tx)}
.pg{position:fixed;inset:0;z-index:7;background:#fff;overflow:auto;padding:0 max(16px,calc((100% - 608px)/2)) 40px}
.top{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 0 8px;position:sticky;top:0;background:#fff}
.top button{border:0;background:0;padding:6px 0}.top a,.lk{color:#2383e2;text-decoration:none}
.ti{border:0;font-size:22px;font-weight:700;padding:6px 0}
.pg label{display:block;margin-top:14px;color:var(--mu);font-size:13px}
.pg label>*{margin-top:4px;color:var(--tx);font-size:15px}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.th{position:relative;aspect-ratio:1;border:1px solid var(--bd);border-radius:6px;overflow:hidden;display:grid;place-items:center;font-size:26px;color:var(--mu);cursor:pointer}
.th img{width:100%;height:100%;object-fit:cover}
.th button{position:absolute;top:4px;right:4px;width:24px;height:24px;border:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;line-height:1}
.dng{margin-top:28px;border:0;background:0;color:#eb5757;padding:8px 0}
.lb{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.92);display:grid;place-items:center}.lb img{max-width:100%;max-height:100%}
#ts{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:#fff;padding:8px 14px;border-radius:6px;font-size:14px;z-index:10}
</style></head><body>
<div class="w">
<h1>連結收藏</h1>
<input id="q" type="search" placeholder="搜尋標題、備註、地址">
<nav id="fs"></nav><div id="bar"></div><main id="ls"></main>
<footer><button id="ex">匯出備份</button><button id="im">匯入備份</button><button id="ins" hidden>安裝成 App</button><input id="imf" type="file" accept=".json" hidden></footer>
</div>
<button id="fab" aria-label="新增連結">+</button>
<div id="ov"></div>
<script>
const $=s=>document.querySelector(s);
let S={folders:[],items:[],last:''},cur='all',qs='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch{return u}};
const plat=u=>{const h=host(u);return /threads/.test(h)?'Threads':/instagram/.test(h)?'Instagram':/facebook|(^|\.)fb\.(com|watch|me)/.test(h)?'Facebook':/youtu/.test(h)?'YouTube':/(^|\.)x\.com|twitter/.test(h)?'X':h};
const fname=id=>S.folders.find(f=>f.id===id)?.name||'';
const opts=sel=>'<option value="">未分類</option>'+S.folders.map(f=>`<option value="${f.id}"${f.id===sel?' selected':''}>${esc(f.name)}</option>`).join('');
const idb=()=>new Promise((r,j)=>{const q=indexedDB.open('linkbox',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
async function load(){try{const d=await idb();return await new Promise(r=>{const g=d.transaction('kv').objectStore('kv').get('s');g.onsuccess=()=>r(g.result);g.onerror=()=>r()})}catch(e){}}
async function save(){try{const d=await idb();d.transaction('kv','readwrite').objectStore('kv').put(S,'s')}catch(e){}}
function toast(m){const t=document.createElement('div');t.id='ts';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),1800)}
const shrink=f=>new Promise(r=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,1000/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.8))};i.src=u});

function render(){
 const chip=(id,n)=>`<button class="chip${cur===id?' on':''}" data-f="${id}">${esc(n)}</button>`;
 $('#fs').innerHTML=chip('all','全部')+chip('none','未分類')+S.folders.map(f=>chip(f.id,f.name)).join('')+'<button class="chip add" id="nf">＋ 資料夾</button>';
 $('#bar').innerHTML=S.folders.some(f=>f.id===cur)?'<button id="rn">重新命名</button><button id="dl">刪除資料夾</button>':'';
 const k=qs.toLowerCase();
 const L=S.items.filter(i=>(cur==='all'||(cur==='none'?!i.folder:i.folder===cur))&&(!k||[i.title,i.url,i.note,i.addr].join(' ').toLowerCase().includes(k)));
 $('#ls').innerHTML=L.length?L.map(i=>`<div class="it" data-i="${i.id}"><div class="tt">${esc(i.title||host(i.url))}</div><div class="mt">${esc(plat(i.url))}${i.folder?' / '+esc(fname(i.folder)):''}${i.imgs.length?' / 圖片 '+i.imgs.length:''}</div>${i.note?`<div class="nt">${esc(i.note)}</div>`:''}${i.addr?`<div class="nt">📍 ${esc(i.addr)}</div>`:''}</div>`).join(''):`<p class="em">${S.items.length?'沒有符合的項目':'還沒有收藏。<br>在 Threads、IG、FB 按分享並選「連結收藏」，<br>或點右下角 ＋ 貼上連結。'}</p>`;
}
$('#fs').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.id==='nf'){const n=prompt('資料夾名稱');if(n?.trim()){const f={id:uid(),name:n.trim()};S.folders.push(f);cur=f.id;save()}}
 else cur=b.dataset.f;render()};
$('#bar').onclick=e=>{const f=S.folders.find(x=>x.id===cur);if(!f)return;
 if(e.target.id==='rn'){const n=prompt('新的名稱',f.name);if(n?.trim()){f.name=n.trim();save()}}
 if(e.target.id==='dl'&&confirm(`刪除資料夾「${f.name}」？裡面的項目會移到未分類。`)){S.items.forEach(i=>{if(i.folder===f.id)i.folder=''});S.folders=S.folders.filter(x=>x!==f);cur='all';save()}
 render()};
$('#ls').onclick=e=>{const d=e.target.closest('[data-i]');if(d)showDet(d.dataset.i)};
$('#q').oninput=e=>{qs=e.target.value;render()};
$('#fab').onclick=()=>showAdd({folder:S.folders.some(f=>f.id===cur)?cur:S.last});

function showAdd(p={}){
 const o=$('#ov');
 o.innerHTML=`<div class="bk"></div><div class="sh"><h2>儲存連結</h2><input id="au" type="url" placeholder="貼上網址" value="${esc(p.url||'')}"><input id="at" placeholder="標題（選填）" value="${esc(p.title||'')}"><select id="af">${opts(p.folder??S.last)}</select><div class="row"><button class="g" id="ac">取消</button><button class="p" id="as">儲存</button></div></div>`;
 const close=()=>o.innerHTML='';
 o.querySelector('.bk').onclick=$('#ac').onclick=close;
 $('#as').onclick=()=>{
  let url=$('#au').value.trim();if(!url)return toast('請輸入網址');
  if(!/^https?:\/\//i.test(url))url='https://'+url;
  const ex=S.items.find(i=>i.url===url);
  if(ex){close();toast('這個連結已經收藏過了');return showDet(ex.id)}
  const folder=$('#af').value;
  S.items.unshift({id:uid(),url,title:$('#at').value.trim(),note:'',addr:'',imgs:[],folder,t:Date.now()});
  S.last=folder;save();close();render();toast('已儲存')};
}

function showDet(id){
 const i=S.items.find(x=>x.id===id);if(!i)return;const o=$('#ov');
 const draw=()=>{
  o.innerHTML=`<div class="pg"><div class="top"><button id="bk">‹ 返回</button><a href="${esc(i.url)}" target="_blank" rel="noopener">開啟連結</a></div>
  <input class="ti" id="dt" placeholder="標題" value="${esc(i.title)}">
  <div class="mt">${esc(plat(i.url))}　${esc(i.url)}</div>
  <label>資料夾<select id="df">${opts(i.folder)}</select></label>
  <label>備註<textarea id="dn" rows="5" placeholder="想記下來的事…">${esc(i.note)}</textarea></label>
  <label>地址<input id="da" placeholder="店名或地址" value="${esc(i.addr)}"></label>
  <a class="lk" id="ml" target="_blank" rel="noopener">在地圖開啟</a>
  <div class="gr">${i.imgs.map((s,n)=>`<div class="th"><img src="${s}" data-v="${n}" alt=""><button data-x="${n}" aria-label="移除圖片">×</button></div>`).join('')}<label class="th">＋<input id="di" type="file" accept="image/*" multiple hidden></label></div>
  <button class="dng" id="dx">刪除此項目</button></div>`;
  const up=(k,v)=>{i[k]=v;save()};
  const setMap=()=>{const a=$('#ml');a.hidden=!i.addr;a.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(i.addr)};setMap();
  $('#bk').onclick=()=>{o.innerHTML='';render()};
  $('#dt').oninput=e=>up('title',e.target.value);
  $('#df').onchange=e=>up('folder',e.target.value);
  $('#dn').oninput=e=>up('note',e.target.value);
  $('#da').oninput=e=>{up('addr',e.target.value);setMap()};
  $('#di').onchange=async e=>{for(const f of e.target.files)i.imgs.push(await shrink(f));save();draw()};
  o.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{i.imgs.splice(+b.dataset.x,1);save();draw()});
  o.querySelectorAll('[data-v]').forEach(m=>m.onclick=()=>{const l=document.createElement('div');l.className='lb';l.innerHTML=`<img src="${i.imgs[+m.dataset.v]}" alt="">`;l.onclick=()=>l.remove();document.body.append(l)});
  $('#dx').onclick=()=>{if(confirm('刪除這個項目？')){S.items=S.items.filter(x=>x!==i);save();o.innerHTML='';render()}};
 };draw();
}

$('#ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='linkbox-backup.json';a.click()};
$('#im').onclick=()=>$('#imf').click();
$('#imf').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());
 d.folders.forEach(f=>{if(!S.folders.some(x=>x.id===f.id))S.folders.push(f)});
 d.items.forEach(i=>{if(!S.items.some(x=>x.id===i.id))S.items.push(i)});
 S.items.sort((a,b)=>b.t-a.t);save();render();toast('已匯入')}catch{toast('檔案格式不正確')}};
let ip;addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;$('#ins').hidden=false});
$('#ins').onclick=()=>ip?.prompt();

(async()=>{
 const d=await load();if(d)S=Object.assign(S,d);render();
 const p=new URLSearchParams(location.search);
 if(['url','text','title'].some(k=>p.has(k))){
  const raw=['url','text','title'].map(k=>p.get(k)||'').join(' ');
  const url=(raw.match(/https?:\/\/[^\s]+/)||[''])[0];
  let title=(p.get('title')||'').trim();if(!title)title=(p.get('text')||'').replace(url,'').trim();
  if(title===url)title='';
  history.replaceState(null,'',location.pathname);
  showAdd({url,title:title.slice(0,120)});
 }
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script></body></html>
